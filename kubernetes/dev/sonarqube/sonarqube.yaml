apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://SonarSource.github.io/helm-chart-sonarqube'
    targetRevision: '10.5.1'
    chart: sonarqube
    helm:
      #FYI memory= 256Mi   # 256MB of RAM
      #FYI cpu= 250m       # 1vCPU/core = 1000m (250m = 0.25 of single core, 25%)
      values: |
        nodeSelector:
          node.kubernetes.io/instance-type: c7i-flex.large
        jvmOpts: "-Xmx1G -Xms1G"
        elasticsearch: 
          jvmOpts: "-Xmx1G -Xms1G"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "monitoring"
            effect: "NoSchedule
        persistence:
          enabled: true
          # A standard gp3 default storage class will be used
          size: 5Gi
          storageClass: gp3-dev-sc
          accessMode: ReadWriteOnce
        postgresql:
          enabled: true
          primary:
            persistence:
              enabled: true
              # A standard gp3 default storage class will be used
              size: 8Gi
              storageClass: gp3-dev-sc
          accessMode: ReadWriteOnce
            resources:
              requests:
                memory: 256Mi   
                cpu: 250m       
        resources:  
          requests:
            memory: 1.5Gi
            cpu: "500m"
        ingress: 
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
            nginx.ingress.kubernetes.io/proxy-body-size: "64m"
          hosts:
            - name: sonarqube.mycompany.test
        
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true