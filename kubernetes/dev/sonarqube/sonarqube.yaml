apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://SonarSource.github.io/helm-chart-sonarqube'
    targetRevision: '15.5.0'
    chart: sonarqube
    helm:
      #FYI memory= 256Mi   # 256MB of RAM
      #FYI cpu= 250m       # 1vCPU/core = 1000m (250m = 0.25 of single core, 25%)
      values: |
        nodeSelector:
          node.kubernetes.io/instance-type: c7i-flex.large
          workload-type: monitoring
        jvmOpts: "-Xmx768m -Xms768m"
        elasticsearch: 
          jvmOpts: "-Xmx768m -Xms768m"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "monitoring"
            effect: "NoSchedule"
        initContainers:
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "monitoring"
              effect: "NoSchedule"
        persistence:
          enabled: true
          # A standard gp3 default storage class will be used
          size: 5Gi
          storageClass: gp3-dev-sc
          accessMode: ReadWriteOnce          
        resources:  
          requests:
            memory: 1.5Gi
            cpu: "500m"
          limits:
            memory: 2800Mi
            cpu: "1"
        jdbcOverwrite:
          enabled: true
          # The service name created by the bitnami chart is usually <release-name>-postgresql
          jdbcUrl: "jdbc:postgresql://sonarqube-db-postgresql.sonarqube.svc.cluster.local:5432/sonarDB"
          jdbcUsername: "sonarUser"
          jdbcPassword: "sonarPass"
        ingress: 
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
            nginx.ingress.kubernetes.io/proxy-body-size: "64m"
          hosts:
            - name: sonarqube.mycompany.test
        
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true