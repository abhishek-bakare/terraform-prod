apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "2026.3.1"

    helm:
      values: |

        community:
          enabled: true

        monitoringPasscode: "SonarMonitoring@123"

        replicaCount: 1

        nodeSelector:
          workload-type: monitoring

        tolerations:
          - key: dedicated
            operator: Equal
            value: monitoring
            effect: NoSchedule

        persistence:
          enabled: true
          storageClass: gp3-dev-sc
          size: 10Gi

        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 3Gi

        jvmOpts: "-Xms512m -Xmx1024m"

        ingress:
          enabled: true
          ingressClassName: nginx

          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: HTTP
            nginx.ingress.kubernetes.io/proxy-body-size: "64m"

          hosts:
            - name: sonarqube.mycompany.test
              path: /
              pathType: Prefix

        postgresql:
          enabled: true

          auth:
            username: sonar
            password: sonar123
            database: sonarqube

          primary:

            nodeSelector:
              workload-type: monitoring

            tolerations:
              - key: dedicated
                operator: Equal
                value: monitoring
                effect: NoSchedule

            persistence:
              enabled: true
              storageClass: gp3-dev-sc
              size: 20Gi

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true