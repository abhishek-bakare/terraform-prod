apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-dev-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain       # if PVC is deleted, corresponding PV is released but then AWS preserve the volume. Delete will delete the volume
volumeBindingMode: WaitForFirstConsumer   # instead of creating volume immediately after sc applies, K8 will create volume when any pod asks for volume
allowVolumeExpansion: true
