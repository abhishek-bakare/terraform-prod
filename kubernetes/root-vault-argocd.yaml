apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cluster-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/abhishek-bakare/terraform-prod.git'
    targetRevision: staging
    path: kubernetes/dev
    directory:            # this tell argocd to look inside all folders
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:            # automated deployments
      prune: true         # if u delete yaml from github then resource will be deleted by argocd in k8
      selfHeal: true      # if someone manually changes using kubectl argocd detects it overwrite it from git